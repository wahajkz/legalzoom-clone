<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="output.css">
    <link rel="icon" href="images.jpg">
    <title>Legal Zoom</title>
</head>

<body>
    <nav
        class="w-full h-20 bg-white shadow-sm shadow-gray-300 flex items-center justify-between lg:justify-center px-4">
        <h1 class="text-2xl font-extrabold">LEGALZOOM</h1>

        <ul class="hidden lg:flex gap-5 ms-8">
            <li class="flex items-center gap-1 font-semibold hover:text-gray-500 cursor-pointer">Business
                <i class="fa-solid fa-chevron-down text-sm"></i>
            </li>
            <li class="flex items-center gap-1 font-semibold hover:text-gray-500 cursor-pointer">Personal
                <i class="fa-solid fa-chevron-down text-sm"></i>
            </li>
            <li class="flex items-center gap-1 font-semibold hover:text-gray-500 cursor-pointer">Attorneys
                <i class="fa-solid fa-chevron-down text-sm"></i>
            </li>
            <li class="flex items-center gap-1 font-semibold hover:text-gray-500 cursor-pointer">Forms
                <i class="fa-solid fa-chevron-down text-sm"></i>
            </li>
            <li class="flex items-center gap-1 font-semibold hover:text-gray-500 cursor-pointer">Personal
                <i class="fa-solid fa-chevron-down text-sm"></i>
            </li>
        </ul>

        <div class="hidden lg:flex ms-10 items-center gap-3">
            <div class="font-semibold hover:text-gray-500 cursor-pointer">(855) 787-1922</div>
            <div
                class="h-10 w-10 rounded-full border-[2px] border-black flex items-center justify-center text-xl hover:text-white hover:border-0 hover:bg-gray-500">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div
                class="h-12 w-24 rounded-4xl bg-black text-white font-semibold flex items-center justify-center hover:bg-gray-500">
                Sign in
            </div>
        </div>

        <div class="flex lg:hidden text-2xl cursor-pointer">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>
</body>

</html>
